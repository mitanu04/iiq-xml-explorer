# Builds, tests and packages IIQ XML Explorer.
#
# - Every push and pull request: compile, run the unit tests and package the extension.
#   The .vsix is uploaded as a workflow artifact (Actions tab → the run → Artifacts).
# - Pushing a tag like v0.4.2: same build, then a GitHub Release is created with the .vsix attached.
#   The tag must match the "version" in package.json.
# - "Run workflow" button (workflow_dispatch): build on demand from any branch.

name: Build extension

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.package.outputs.vsix }}
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and run tests
        run: npm test

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Update package.json or use tag v$version."
            exit 1
          fi

      - name: Package the extension
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          vsix="iiq-xml-explorer-$version.vsix"
          npx vsce package --allow-missing-repository --out "$vsix"
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaged **$vsix**" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the .vsix as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.vsix }}
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error
          retention-days: 30

  release:
    # Only for version tags, after a successful build.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the .vsix
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.vsix }}

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ needs.build.outputs.vsix }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "IIQ XML Explorer ${{ needs.build.outputs.version }}" \
            --generate-notes
